<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Background Block (JS-Style Tile) -->
  <rect x="0" y="0" width="512" height="512" fill="#0f172a"/>

  <!-- High-Contrast Accent Corner Stripe -->
  <polygon points="0,0 96,0 0,96" fill="#0284c7"/>

  <!-- Compact Atomic Number "14" -->
  <text x="38" y="220" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="120" 
        font-weight="900" 
        fill="#38bdf8" 
        letter-spacing="-6">14</text>

  <!-- Massive Primary Symbol "Si" -->
  <text x="474" y="450" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="320" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="end" 
        letter-spacing="-12">Si</text>
</svg>
